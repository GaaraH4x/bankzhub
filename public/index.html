<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bankz</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="nav-logo" id="logo">Bankz</div>
  <ul class="nav-links" id="navLinks"></ul>
</nav>

<section id="hero">
  <div class="hero-container">

    <div class="hero-left">
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <p class="hero-hook" id="hero-hook"></p>

      <div class="btn-group" id="hero-buttons"></div>
    </div>

    <div class="hero-right">
      <div class="image-box">
        <img id="slider" src="" />
      </div>
    </div>

  </div>
</section>

<section id="projects">
  <h2 class="section-title">Projects</h2>
  <div class="projects-grid" id="projects-container"></div>
</section>

<footer>
  <div class="footer-links" id="social-links"></div>
</footer>

<script src="script.js"></script>
</body>
</html>
